# gitleaks configuration (P0-081). Extends the built-in rules; only adds
# allowlists for values that look like keys but are public by definition.
# Keep each entry narrow, say why it is safe, and re-run the planted-secret
# check in docs/runbooks/security-scanning.md (section 4) after changing anything here.

title = "early-eagles gitleaks config"

[extend]
useDefault = true

# Svix / Clerk webhook signing secrets (P0-037). Not in the default rules: a
# random whsec_ value assigned to any variable went unreported.
[[rules]]
id = "svix-webhook-signing-secret"
description = "Svix webhook signing secret (Clerk webhooks)"
regex = '''\b(whsec_[A-Za-z0-9+/]{24,}={0,2})'''
secretGroup = 1
keywords = ["whsec_"]

[[allowlists]]
description = "Azure built-in role definition IDs (Bicep): fixed, public GUIDs documented by Microsoft"
regexTarget = "line"
# Not anchored with ^/$: gitleaks' "line" target doesn't match them reliably.
# A path filter is deliberately absent too: an allowlist's conditions are OR'd
# by default, so a path entry would silence every finding in every .bicep file.
regexes = [
  '''\bvar \w+RoleId = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'(\s|$)''',
]

[[allowlists]]
description = "A made-up Resend API key in a unit test (EmailSenderRegistrationTests, commit 842aa73); never a real key"
# The secret itself, only this exact value. It stays in git history, so
# changing the test would not clear the finding.
regexes = [
  '''^re_test_123456789$''',
]

[[allowlists]]
description = "The example signing secret from Svix's public documentation, used as a test vector (SvixWebhookVerifierTests)"
# Matches the secret itself (the default target), and only this exact value.
regexes = [
  '''^whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw$''',
]
