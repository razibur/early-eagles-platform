# P0-080 — dependency update PRs (security advisories arrive regardless of
# this schedule; this file governs routine version updates).
#
# - Weekly, Monday morning US Eastern, so updates land at the start of a week.
# - Minor + patch bumps are grouped into one PR per ecosystem; majors come one
#   per PR because they're the ones that need reading.
# - cooldown: a release must be 14 days old before Dependabot proposes it,
#   the same rule used by hand (a fresh release is the riskiest one).
# - Commit messages start with "deps", matching CONTRIBUTING.md's
#   non-task prefix style.

version: 2

updates:
  - package-ecosystem: nuget
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(api)"
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ASP.NET Core 10's OpenAPI source generator is compiled against
      # Microsoft.OpenApi 2.x; 3.x makes it emit code that doesn't build
      # (CS0200 on IOpenApiMediaType.Example, PR #10). Revisit with .NET 11.
      - dependency-name: Microsoft.OpenApi
        update-types: ["version-update:semver-major"]

  # One lockfile at the repo root covers every npm workspace (apps/web today).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler): `next build` fails with it (PR #3).
      # Revisit when Next.js documents support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ESLint 10: eslint-plugin-react (via eslint-config-next) calls the
      # removed context.getFilename() (PR #5). Revisit when eslint-config-next
      # supports ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node.js runtime (22: CI, engines); types for a
      # newer Node would allow APIs the runtime doesn't have. Bump together
      # with node-version in the workflows.
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 14
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]
